<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <!-- Amber Accent Ring / Border -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.85"/>
  <!-- Hazard Diagonal Lines in Header Strip -->
  <path d="M 6 14 L 14 6 M 16 14 L 24 6 M 26 14 L 34 6 M 36 14 L 44 6 M 46 14 L 54 6" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <!-- Gate Barrier Pillar Left -->
  <rect x="12" y="34" width="7" height="20" rx="2" fill="#e2e8f0"/>
  <rect x="14" y="30" width="3" height="4" rx="1" fill="#f59e0b"/>
  <!-- Gate Barrier Arm (Diagonal Up-Right) -->
  <g transform="rotate(-25 15 36)">
    <rect x="15" y="33" width="36" height="6" rx="2" fill="#f59e0b"/>
    <!-- Black stripes on gate arm -->
    <path d="M 23 33 L 20 39 M 31 33 L 28 39 M 39 33 L 36 39 M 47 33 L 44 39" stroke="#0f172a" stroke-width="2.5"/>
  </g>
  <!-- Security Signal Light -->
  <circle cx="15.5" cy="26" r="3.5" fill="#22c55e"/>
</svg>
